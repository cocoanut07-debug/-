<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 음식 영양 및 알레르기 분석</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #18181b;
      --muted: #6b7280;
      --primary: #16a34a;
      --primary-hover: #15803d;
      --border: #e5e7eb;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --warn-text: #92400e;
      --warn-badge: #fef3c7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    select, input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
    }

    .preview-box {
      margin: 14px 0;
      text-align: center;
      display: none;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 12px;
      border: 1px solid var(--border);
      object-fit: cover;
    }

    button.submit-btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button.submit-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button.submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 22px;
    }

    .status.error {
      color: #dc2626;
      font-weight: 600;
    }

    /* 분석 결과 카드 */
    #resultCard {
      display: none;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .food-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .calorie-pill {
      background: #dcfce7;
      color: #166534;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .macro-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .macro-item {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .macro-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .macro-value {
      font-size: 1rem;
      font-weight: 700;
    }

    /* 주요 알레르기 유발 성분 박스 */
    .allergen-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .allergen-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--warn-text);
    }

    .allergen-badge {
      background: var(--warn-badge);
      border: 1px solid var(--warn-border);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
    }

    .allergen-text {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--warn-text);
    }

    .comment-box {
      background: #f9fafb;
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.92rem;
      margin-bottom: 12px;
    }

    .drive-link {
      font-size: 0.85rem;
    }

    .drive-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .drive-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .form-row,
      .macro-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🍽️ 음식 영양 및 알레르기 분석</h1>
      <p class="subtitle">음식 사진을 업로드하면 칼로리, 영양 성분, 주요 알레르기 유발 성분을 분석하고 기록합니다.</p>

      <form id="analyzeForm">
        <div class="form-row">
          <div>
            <label for="gender">성별</label>
            <select id="gender" name="gender" required>
              <option value="여성">여성</option>
              <option value="남성">남성</option>
              <option value="선택 안 함">선택 안 함</option>
            </select>
          </div>
          <div>
            <label for="ageGroup">나이대</label>
            <select id="ageGroup" name="ageGroup" required>
              <option value="10대">10대</option>
              <option value="20대" selected>20대</option>
              <option value="30대">30대</option>
              <option value="40대">40대</option>
              <option value="50대">50대</option>
              <option value="60대 이상">60대 이상</option>
            </select>
          </div>
        </div>

        <div>
          <label for="foodImage">음식 사진 선택</label>
          <input type="file" id="foodImage" accept="image/*" required />
        </div>

        <div class="preview-box" id="previewBox">
          <img id="previewImg" alt="선택한 음식 미리보기" />
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">AI 영양 및 알레르기 분석 시작</button>
        <div class="status" id="statusText"></div>
      </form>
    </div>

    <!-- 분석 결과 카드 -->
    <div class="card" id="resultCard">
      <div class="result-header">
        <h2 class="food-title" id="resultFoodName">-</h2>
        <span class="calorie-pill" id="resultCalories">- kcal</span>
      </div>

      <div class="macro-grid">
        <div class="macro-item">
          <div class="macro-label">탄수화물</div>
          <div class="macro-value" id="resultCarbs">-</div>
        </div>
        <div class="macro-item">
          <div class="macro-label">단백질</div>
          <div class="macro-value" id="resultProtein">-</div>
        </div>
        <div class="macro-item">
          <div class="macro-label">지방</div>
          <div class="macro-value" id="resultFat">-</div>
        </div>
        <div class="macro-item">
          <div class="macro-label">적정 섭취량</div>
          <div class="macro-value" id="resultPortion">-</div>
        </div>
      </div>

      <!-- 주요 알레르기 유발 성분 표시 영역 -->
      <div class="allergen-box">
        <div class="allergen-header">
          <span class="allergen-badge">알레르기 주의</span>
          <span>주요 알레르기 유발 성분</span>
        </div>
        <p class="allergen-text" id="resultAllergens">해당 없음</p>
      </div>

      <div class="comment-box" id="resultComment"></div>

      <div class="drive-link" id="driveLinkWrap" style="display: none;">
        업로드된 원본 사진: <a id="driveLink" href="#" target="_blank" rel="noopener noreferrer">Google 드라이브에서 보기</a>
      </div>
    </div>
  </div>

  <script>
    // 본인의 Google Apps Script 웹 앱(/exec) URL로 교체하세요.
    const GAS_WEB_APP_URL = '여기에_GAS_웹앱_URL_입력';

    const form = document.getElementById('analyzeForm');
    const fileInput = document.getElementById('foodImage');
    const previewBox = document.getElementById('previewBox');
    const previewImg = document.getElementById('previewImg');
    const submitBtn = document.getElementById('submitBtn');
    const statusText = document.getElementById('statusText');
    const resultCard = document.getElementById('resultCard');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        previewBox.style.display = 'none';
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        previewBox.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const resultStr = String(reader.result || '');
          const base64Data = resultStr.includes(',') ? resultStr.split(',')[1] : resultStr;
          resolve(base64Data);
        };
        reader.onerror = () => reject(new Error('파일을 읽는 중 오류가 발생했습니다.'));
        reader.readAsDataURL(file);
      });
    }

    function renderResult(responseJson) {
      const d = responseJson.data || {};

      document.getElementById('resultFoodName').textContent = d.foodName || '인식 불가';
      document.getElementById('resultCalories').textContent = d.calories || '-';
      document.getElementById('resultCarbs').textContent = d.carbs || d.carbsAndProtein || '-';
      document.getElementById('resultProtein').textContent = d.protein || '-';
      document.getElementById('resultFat').textContent = d.fat || '-';
      document.getElementById('resultPortion').textContent = d.recommendedPortion || '-';

      // 주요 알레르기 유발 성분 반영
      const allergenValue = (d.allergens && String(d.allergens).trim()) || '해당 없음';
      document.getElementById('resultAllergens').textContent = allergenValue;

      document.getElementById('resultComment').textContent = d.comment || '영양 코멘트가 없습니다.';

      const driveLinkWrap = document.getElementById('driveLinkWrap');
      const driveLink = document.getElementById('driveLink');
      if (responseJson.fileUrl) {
        driveLink.href = responseJson.fileUrl;
        driveLinkWrap.style.display = 'block';
      } else {
        driveLinkWrap.style.display = 'none';
      }

      resultCard.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusText.classList.remove('error');

      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        statusText.textContent = '음식 사진을 먼저 선택해 주세요.';
        statusText.classList.add('error');
        return;
      }

      submitBtn.disabled = true;
      statusText.textContent = 'AI 영양 및 알레르기 분석, 드라이브 저장 중...';

      try {
        const base64Data = await readFileAsBase64(file);
        const payload = {
          gender: document.getElementById('gender').value,
          ageGroup: document.getElementById('ageGroup').value,
          fileName: file.name,
          mimeType: file.type || 'image/jpeg',
          base64Data
        };

        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (!json.success) {
          throw new Error(json.error || '분석 처리 중 오류가 발생했습니다.');
        }

        renderResult(json);
        statusText.textContent = '분석 및 기록이 완료되었습니다.';
      } catch (err) {
        statusText.textContent = '오류: ' + (err.message || String(err));
        statusText.classList.add('error');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
